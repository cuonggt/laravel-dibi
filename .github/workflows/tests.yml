name: tests

on:
  push:
    branches:
      - master
  # No base-branch filter, so a pull request stacked on another branch
  # still runs CI rather than reporting no checks at all.
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        php: [8.1, 8.2, 8.3, 8.4]
        laravel: [9, 10, 11, 12, 13]
        exclude:
          - php: 8.1
            laravel: 11
          - php: 8.1
            laravel: 12
          - php: 8.1
            laravel: 13
          - php: 8.2
            laravel: 13
          - php: 8.3
            laravel: 9
          - php: 8.4
            laravel: 9
          - php: 8.4
            laravel: 10

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, json, libxml, mbstring, zip
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none

      - name: Set Laravel version
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 5
          command: composer require "laravel/framework=^${{ matrix.laravel }}" --no-interaction --no-update

      - name: Install dependencies
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 5
          command: composer update --prefer-stable --no-interaction

      - name: Execute tests
        run: vendor/bin/phpunit

  frontend:
    runs-on: ubuntu-latest

    name: Frontend (lint + build)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build assets
        run: npm run build

      - name: Verify committed assets match the build
        run: |
          if [ -n "$(git status --porcelain -- public/)" ]; then
            echo "::error::The assets committed in public/ are stale. Run 'npm run build' and commit the result."
            git status --short -- public/
            exit 1
          fi
          echo "Committed assets match a fresh build."

  code-style:
    runs-on: ubuntu-latest

    name: Code style (php-cs-fixer)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: curl, dom, json, libxml, mbstring, zip
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 5
          command: composer update --prefer-stable --no-interaction

      - name: Check code style
        run: vendor/bin/php-cs-fixer fix --dry-run --diff
